[package]
name = "yoyo"
version = "1.0.7"
edition = "2021"
description = "A coding agent that evolves itself. Born as 600 lines of Rust, growing up in public."
license = "MIT"
repository = "https://github.com/AdrianChallinorOsiris/train-evolve"

[dependencies]
axum = "0.7"
serde_json = "1"
yoagent = "0.5"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
